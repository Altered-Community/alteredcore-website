@if (mode() === 'equinox') {
  <app-equinox-import #equinox (closed)="ref.close()" (signIn)="signIn()" (busy)="guardClose($event, equinox)">
    <ar-segmented ariaLabel="Source" i18n-ariaLabel="@@decks.import.mode" [fullWidth]="true" [options]="modes" [value]="mode()" (valueChange)="mode.set($event ?? 'list')" />
  </app-equinox-import>
} @else {
<div class="ar-overlay-body">
  <ar-segmented ariaLabel="Source" i18n-ariaLabel="@@decks.import.mode" [fullWidth]="true" [options]="modes" [value]="mode()" (valueChange)="mode.set($event ?? 'list')" />
  <ar-input label="Nom du deck" i18n-label="@@decks.import.name" placeholder="Deck importé" i18n-placeholder="@@decks.import.defaultName" [(value)]="name" />
  <ar-select label="Format" i18n-label="@@decks.import.format" [options]="formats" [value]="format()" (valueChange)="setFormat($event)" />
  <label class="label" for="import-text" i18n="@@decks.import.listLabel">Liste (une carte par ligne : « 3 ALT_CORE_B_AX_04_C »)</label>
  <textarea id="import-text" rows="10" [value]="text()" (input)="text.set($any($event.target).value)" placeholder="1 ALT_CORE_B_AX_01_C&#10;3 ALT_CORE_B_AX_04_C"></textarea>
  @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
  }
</div>
<div class="ar-overlay-footer">
  <button arButton variant="secondary" class="secondary-action" [disabled]="busy()" (click)="ref.close()" i18n="@@decks.import.cancel">Annuler</button>
  <button arButton [size]="bp.compact() ? 'lg' : 'md'" [fullWidth]="bp.compact()" [disabled]="busy() || !text().trim()" (click)="run()">
    @if (busy()) {
      <ng-container i18n="@@decks.import.importing">Import…</ng-container>
    } @else {
      <ng-container i18n="@@decks.import.submit">Importer</ng-container>
    }
  </button>
</div>
}
