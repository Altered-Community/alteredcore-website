@if (bp.compact()) {
  <ar-app-bar class="static" title="Cartes" i18n-title="@@cards.page.title" />
}

<main class="page">
  @if (!bp.compact()) {
    <div class="head">
      <h1 i18n="@@cards.page.title">Cartes</h1>

    </div>
  }
  <app-card-search [sources]="sources" [browse]="true" />
</main>
