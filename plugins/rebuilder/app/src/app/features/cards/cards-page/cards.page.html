@if (bp.compact()) {
  <ac-app-bar title="Cartes" i18n-title="@@cards.page.title" [sticky]="false" />
}

<main class="page">
  @if (!bp.compact()) {
    <div class="head">
      <h1 i18n="@@cards.page.title">Cartes</h1>
      <p i18n="@@cards.page.intro">Toutes les cartes d’Altered et les Uniques, par faction, extension, rareté, type, coût, texte ou effet.</p>
    </div>
  }
  <app-card-search class="search" [browse]="true" />
</main>
