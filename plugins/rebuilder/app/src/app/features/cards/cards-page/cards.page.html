@if (bp.compact()) {
  <ar-app-bar class="static" appearance="compact" title="Cartes">
    <button leading arIconButton="menu" variant="ghost" ariaLabel="Menu du site" [iconSize]="22" (click)="menu.open()"></button>
  </ar-app-bar>
}

<main class="page">
  @if (!bp.compact()) {
    <div class="head">
      <h1>Cartes</h1>
      <p>Toutes les cartes d’Altered et les Uniques, par faction, extension, rareté, type, coût ou effet.</p>
    </div>
  }
  <app-card-search [sources]="sources" [browse]="true" />
</main>
