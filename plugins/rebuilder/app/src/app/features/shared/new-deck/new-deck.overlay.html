<div class="ar-overlay-body new-deck-body">
  <section #heroesCol class="heroes" [class.narrow]="narrow()" aria-labelledby="new-deck-hero-label">
    <div class="heroes-head">
      <span class="label" id="new-deck-hero-label">Héros <span class="req" aria-hidden="true">*</span></span>
      @if (!bp.compact()) {
        <span class="hint">Détermine la faction et les cartes disponibles</span>
      }
    </div>
    <ar-faction-tabs
      size="sm"
      [layout]="bp.compact() ? 'scroll' : 'grid'"
      [columns]="narrow() ? 3 : 6"
      controls="new-deck-heroes"
      [(active)]="faction"
    />
    <ar-hero-selector
      panelId="new-deck-heroes"
      [layout]="bp.compact() ? 'carousel' : 'grid'"
      [columns]="narrow() ? 3 : 4"
      [heroes]="heroes()"
      [error]="error()"
      [faction]="faction()"
      [selected]="form.hero()"
      (selectedChange)="form.selectHero($event)"
    />
  </section>
  <div class="side">
    <ar-input
      label="Nom du deck"
      [required]="true"
      placeholder="ex : Moyo Embrasement"
      enterkeyhint="done"
      [value]="form.name()"
      (valueChange)="form.editName($event)"
      (enter)="create()"
    />
    <div class="field">
      <span class="label">Visibilité</span>
      <ar-segmented ariaLabel="Visibilité" [options]="visibility" [fullWidth]="true" [(value)]="form.isPublic" />
    </div>
    <fieldset>
      <legend class="label">Format <span class="req" aria-hidden="true">*</span></legend>
      <div class="formats" role="radiogroup" aria-label="Format">
        @for (f of formats; track f.value) {
          <ar-radio-card
            name="new-deck-format"
            layout="compact"
            [title]="f.label"
            [description]="f.short"
            [tag]="{ label: bga[f.bga].short, tone: bga[f.bga].tone }"
            [checked]="form.format() === f.value"
            (choose)="form.format.set(f.value)"
          />
        }
      </div>
    </fieldset>
  </div>
</div>
<div class="ar-overlay-footer new-deck-footer">
  @if (!bp.compact()) {
    <span class="note" aria-live="polite">
      @if (form.hero(); as h) {
        Sélection : <strong>{{ h.name }}</strong> · {{ factionLabel(h.faction) }}
      } @else {
        Choisissez un héros pour continuer.
      }
    </span>
  }
  <button arButton variant="secondary" class="secondary-action" (click)="ref.close()">Annuler</button>
  <button arButton [size]="bp.compact() ? 'lg' : 'md'" [fullWidth]="bp.compact()" [disabled]="!form.ready()" (click)="create()">
    Créer le deck
  </button>
</div>
