<ul class="strip">
  @for (t of tiles(); track t.reference) {
    <li>
      <button type="button" class="tile" [class.unowned]="!t.owned" [disabled]="!t.owned || saving()" [attr.aria-label]="tileLabel($index + 1)" (click)="pick(t.reference, t.owned)">
        <img [src]="t.src" alt="" loading="lazy" />
      </button>
      @if (t.markers.length) {
        <span class="markers">
          @if (single()) {
            <span class="marker active" role="img" [attr.aria-label]="chosenLabel"><ac-icon name="check" [size]="12" /></span>
          } @else {
            @for (m of t.markers; track m.slotIndex) {
              <button type="button" class="marker" [class.active]="m.slotIndex === active()" [attr.aria-pressed]="m.slotIndex === active()" [attr.aria-label]="markerLabel(m.copy)" (click)="selectMarker(m.slotIndex, $event)">{{ m.copy }}</button>
            }
          }
        </span>
      }
    </li>
  }
</ul>
@if (error(); as e) {
  <p class="error" role="alert">{{ e }}</p>
}
