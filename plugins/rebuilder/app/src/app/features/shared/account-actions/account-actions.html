<button arIconButton="moon" ariaLabel="Thème sombre (bientôt disponible)" [iconSize]="18" disabled></button>
<button type="button" class="pill" aria-label="Langue : français" disabled>FR</button>
@if (auth.sessionRestoring()) {
  <span class="pill user" aria-live="polite">Connexion…</span>
} @else if (auth.isLoggedIn()) {
  <a class="pill user" routerLink="/login" [attr.aria-label]="'Compte ' + name()">
    <ar-avatar [name]="name()" />
    <span>{{ name() }}</span>
    <ar-icon name="chevron-down" [size]="16" />
  </a>
} @else {
  <a class="pill user" routerLink="/login">
    <ar-icon name="user" [size]="18" />
    <span>Se connecter</span>
  </a>
}
