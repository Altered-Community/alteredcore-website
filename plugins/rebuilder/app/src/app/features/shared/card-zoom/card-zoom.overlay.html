<div class="ac-overlay-body">
  <div class="stage">
    <ac-card-tile class="card" [card]="data.card" [plain]="true" [eager]="true" />
  </div>
  <!-- Editor controls sit on a surface; the card and the link alone lie on the backdrop (the site's lightbox). -->
  @if (data.quantity || data.illustrations) {
    <div class="controls">
      @if (data.quantity; as q) {
        <div class="qty">
          <span i18n="@@cardZoom.inDeck">Dans le deck</span>
          <ac-stepper appearance="box" [label]="name()" [itemName]="name()" [value]="quantity()" [max]="q.max" (valueChange)="setQuantity($event)" />
        </div>
      }
      @if (data.illustrations) {
        <button acButton variant="secondary" icon="brush" [fullWidth]="true" aria-haspopup="dialog" (click)="chooseIllustrations()" i18n="@@cardZoom.chooseIllustrations">Choisir les illustrations</button>
      }
    </div>
  }
  <a acButton class="detail" icon="info" [fullWidth]="true" [href]="detailUrl" i18n="@@cardZoom.detail">Accéder au détail</a>
</div>
