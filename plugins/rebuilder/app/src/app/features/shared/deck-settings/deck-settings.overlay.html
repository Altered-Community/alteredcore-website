<div class="ar-overlay-body">
  <div class="hero">
    <span class="thumb">
      @if (hero(); as h) {
        <ar-card-art [reference]="h.reference" [faction]="h.faction" placeholder="" position="center 20%" />
      }
    </span>
    <span class="meta">
      <span class="overline" i18n="@@shared.deckSettings.hero">Héros</span>
      <span class="name">{{ hero()?.name || noHero }}</span>
    </span>
    <button arButton variant="secondary" size="sm" (click)="changeHero()" i18n="@@shared.deckSettings.changeHero">Changer</button>
  </div>
  <div class="field">
    <span class="label" i18n="@@shared.deckSettings.visibility">Visibilité</span>
    <ar-segmented ariaLabel="Visibilité" i18n-ariaLabel="@@shared.deckSettings.visibility" [options]="visibility" [(value)]="isPublic" [fullWidth]="true" />
  </div>
  <fieldset>
    <legend i18n="@@shared.deckSettings.format">Format</legend>
    <div class="formats" role="radiogroup" aria-label="Format" i18n-aria-label="@@shared.deckSettings.format">
      @for (f of formats; track f.value) {
        <ar-radio-card
          name="deck-settings-format"
          [title]="f.label"
          [description]="f.short"
          [tag]="{ label: bga[f.bga].short, tone: bga[f.bga].tone }"
          [checked]="format() === f.value"
          (choose)="format.set(f.value)"
        />
      }
    </div>
  </fieldset>
</div>
<div class="ar-overlay-footer">
  <button arButton variant="secondary" class="secondary-action" (click)="ref.close()" i18n="@@shared.deckSettings.cancel">Annuler</button>
  <button arButton [size]="bp.compact() ? 'lg' : 'md'" [fullWidth]="bp.compact()" (click)="save()" i18n="@@shared.deckSettings.save">Enregistrer</button>
</div>
