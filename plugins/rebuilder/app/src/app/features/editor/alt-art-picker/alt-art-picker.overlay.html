<div class="ac-overlay-body">
  <p class="hint" i18n="@@editor.altArtPicker.hint">Touchez une illustration pour la poser sur l’exemplaire sélectionné.</p>
  <ul class="slots" [style.--copies]="slots().length" aria-label="Exemplaires" i18n-aria-label="@@editor.altArtPicker.copies">
    @for (s of slots(); track $index) {
      <li>
        <span class="slot-label">{{ s.label }}</span>
        <button type="button" class="slot" [class.active]="$index === active()" [attr.aria-pressed]="$index === active()" [attr.aria-label]="s.label" (click)="select($index)">
          <img [src]="s.src" alt="" />
        </button>
      </li>
    }
  </ul>
  <h3 class="pool-title" i18n="@@editor.altArtPicker.available">Illustrations disponibles</h3>
  <ul class="pool">
    @for (p of pool(); track p.reference) {
      <li>
        <button type="button" class="print" [class.off]="p.off" [attr.aria-disabled]="p.off" [attr.aria-label]="p.label + ', ' + p.note" (click)="place(p.reference, p.off)">
          <img [src]="p.src" alt="" loading="lazy" />
          <span class="note">{{ p.note }}</span>
        </button>
      </li>
    }
  </ul>
</div>
<div class="ac-overlay-footer">
  <a class="settings" [href]="settingsUrl" i18n="@@editor.altArtPicker.settings">Modifier mes arts par défaut</a>
  <button acButton variant="secondary" class="secondary-action" icon="wand-sparkles" [disabled]="isDefault()" (click)="resetToDefaults()" i18n="@@editor.altArtPicker.defaults">Arts par défaut</button>
  <button acButton (click)="ref.close()" i18n="@@editor.altArtPicker.close">Fermer</button>
</div>
