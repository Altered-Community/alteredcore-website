<ng-content select="[summary]" />
@if (deck.opening()) {
  @if (!readonly()) {
    <span acSkeleton="panel" class="summary-skeleton"></span>
  }
  <span acSkeleton="panel" class="stats-skeleton"></span>
  <div class="ac-card ac-card--sm section-skeleton" aria-hidden="true">
    <span acSkeleton="text" width="35%"></span>
    @for (r of [0, 1, 2, 3]; track r) {
      <div class="row-skeleton"><span acSkeleton="text" width="55%"></span><span acSkeleton="text" width="80px"></span></div>
    }
  </div>
} @else {
@if (!readonly()) {
  <ac-deck-summary
    [name]="deck.name()"
    [hero]="deck.hero()"
    [formatLabel]="formatLabel()"
    [isPublic]="deck.isPublic()"
    [total]="deck.total()"
    [legal]="legality().state === 'legal'"
    [issues]="deck.status().issues"
    [rarity]="deck.stats().rarity"
    [editable]="deck.editable()"
    (openSettings)="openSettings.emit()"
    (changeHero)="changeHero.emit()"
    (showLegality)="showLegality()"
  />
}
<ac-collapsible class="stats" title="Stats" i18n-title="@@panel.stats" [(open)]="statsOpen">
  <ac-deck-stats [main]="deck.stats().main" [reserve]="deck.stats().reserve" [terrain]="deck.stats().terrain" />
</ac-collapsible>
@if (!readonly() && altArts?.canChoose()) {
  <div class="alt-arts">
    <button acButton variant="secondary" icon="layers" [fullWidth]="true" aria-haspopup="dialog" (click)="chooseTokenArts()" i18n="@@editor.tokenArts.open">Illustrations des jetons</button>
    <button acButton variant="secondary" icon="wand-sparkles" [fullWidth]="true" aria-haspopup="dialog" (click)="applyDefaults()" i18n="@@editor.altArtDefaults.open">Appliquer les arts par défaut</button>
  </div>
}
@for (g of deck.groups(); track g.id) {
  <ac-deck-section appearance="flat" [title]="g.label" [count]="g.count">
    @for (l of g.lines; track l.card.reference) {
      <ac-deck-row
        [card]="l.card"
        [quantity]="l.quantity"
        [max]="altArts?.maxFor(l.card, false) ?? deck.maxFor(l.card)"
        [issues]="issues().get(l.card.reference) ?? noIssues"
        [warning]="altArts?.warnings()?.get(l.card.reference) ?? null"
        [readonly]="readonly() || !deck.editable()"
        (quantityChange)="deck.setQuantity(l.card, $event)"
      />
    }
  </ac-deck-section>
} @empty {
  <p class="empty" i18n="@@editor.list.empty">Aucune carte pour l’instant.</p>
}
}
