<ar-collapsible [title]="t('notes.title')" [bare]="true" [(open)]="open">
  <div class="notes">
    <p class="hint">{{ t('notes.hint') }}</p>
    <textarea
      class="field"
      rows="4"
      maxlength="5000"
      [attr.aria-label]="t('notes.title')"
      [placeholder]="t('notes.placeholder')"
      [value]="body()"
      [disabled]="!loaded()"
      (input)="edit($any($event.target).value)"
    ></textarea>
    <div class="actions">
      <span class="status" role="status">
        @switch (state()) {
          @case ('saved') { {{ t('notes.saved') }} }
          @case ('error') { <span class="error">{{ t('notes.error') }}</span> }
        }
      </span>
      <button arButton type="button" variant="secondary" size="sm" [disabled]="!loaded() || state() === 'saving'" (click)="save()">
        {{ t('notes.save') }}
      </button>
    </div>
  </div>
</ar-collapsible>
