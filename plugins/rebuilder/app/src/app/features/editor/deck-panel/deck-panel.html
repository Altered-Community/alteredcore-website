<div class="summary">
  <ac-deck-summary
    appearance="embedded"
    [hero]="deck.hero()"
    [formatLabel]="formatLabel()"
    [isPublic]="deck.isPublic()"
    [total]="deck.total()"
    [legal]="deck.status().legal && !!deck.hero()"
    [issues]="deck.status().issues"
    [rarity]="deck.stats().rarity"
    [editable]="deck.editable()"
    (openSettings)="openSettings.emit()"
  />
</div>
<ac-collapsible class="stats" [title]="t('panel.stats')" [bare]="true" [(open)]="statsOpen">
  <ac-deck-stats [main]="deck.stats().main" [reserve]="deck.stats().reserve" [terrain]="deck.stats().terrain" />
</ac-collapsible>
<div class="rows">
  @for (g of deck.groups(); track g.id) {
    <div class="group">
      <div class="group-head"><span>{{ g.label }}</span><span>{{ g.count }}</span></div>
      @for (l of g.lines; track l.card.reference) {
        <ac-deck-row
          appearance="panel"
          [card]="l.card"
          [quantity]="l.quantity"
          [max]="deck.maxFor(l.card)"
          [readonly]="!deck.editable()"
          (quantityChange)="deck.setQuantity(l.card, $event)"
        />
      }
    </div>
  } @empty {
    <p class="empty">{{ t('panel.empty') }}</p>
  }
</div>
