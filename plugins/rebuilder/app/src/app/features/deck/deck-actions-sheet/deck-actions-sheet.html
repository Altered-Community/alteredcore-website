<div class="ac-overlay-body" role="menu">
  <button role="menuitem" type="button" (click)="ref.close('copy')" i18n="@@deck.actions.copy"><ac-icon name="copy" [size]="20" />Copier la liste</button>
  <button role="menuitem" type="button" (click)="ref.close('duplicate')" i18n="@@deck.actions.duplicate"><ac-icon name="copy-plus" [size]="20" />Dupliquer</button>
  @if (canDelete) {
    <button role="menuitem" type="button" class="danger" (click)="ref.close('delete')" i18n="@@deck.actions.delete"><ac-icon name="trash-2" [size]="20" />Supprimer</button>
  }
</div>
