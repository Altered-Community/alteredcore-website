@if (step() === 'private') {
  <div class="ar-overlay-body">
    <p class="private-title"><ar-icon name="lock" [size]="16" /><strong i18n="@@deck.share.privateTitle">Ce deck est privé</strong></p>
    <p class="muted" i18n="@@deck.share.privateBody">Le lien ne fonctionne que pour vous. Rendez le deck public pour que les autres puissent y accéder.</p>
    @if (error(); as e) {
      <p class="error" role="alert">{{ e }}</p>
    }
  </div>
  <div class="ar-overlay-footer">
    <button arButton variant="secondary" class="secondary-action" (click)="ref.close()" i18n="@@deck.share.cancel">Annuler</button>
    <button arButton icon="eye" [disabled]="busy()" (click)="makePublic()">
      @if (busy()) {
        <ng-container i18n="@@deck.share.makingPublic">Publication…</ng-container>
      } @else {
        <ng-container i18n="@@deck.share.makePublic">Rendre public & partager</ng-container>
      }
    </button>
  </div>
} @else {
  <div class="ar-overlay-body">
    <div class="link">
      <ar-input class="url" label="Lien" i18n-label="@@deck.share.link" [value]="url" [readonly]="true" />
      <button arButton [icon]="copied() ? 'check' : 'copy'" (click)="copy()">
        @if (copied()) {
          <ng-container i18n="@@deck.share.copied">Copié !</ng-container>
        } @else {
          <ng-container i18n="@@deck.share.copy">Copier</ng-container>
        }
      </button>
    </div>
    <div class="qr">
      <svg role="img" [attr.aria-label]="qrLabel" [attr.viewBox]="'-2 -2 ' + (qr().size + 4) + ' ' + (qr().size + 4)" shape-rendering="crispEdges">
        <path [attr.d]="qr().path" />
      </svg>
    </div>
  </div>
}
