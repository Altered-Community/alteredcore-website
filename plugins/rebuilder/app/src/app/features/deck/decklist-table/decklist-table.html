<div class="head">
  <h2>{{ group().label }}</h2>
  <span class="count">{{ group().count }}</span>
</div>
<div class="row cols" aria-hidden="true">
  <span class="q">Qté</span>
  <span class="n">Carte</span>
  <span class="c">Coût</span>
  <span class="p" title="Forêt"><i class="sq foret"></i></span>
  <span class="p" title="Montagne"><i class="sq montagne"></i></span>
  <span class="p" title="Océan"><i class="sq ocean"></i></span>
</div>
@for (r of rows(); track r.ref) {
  <div class="row">
    <span class="q qty">×{{ r.qty }}</span>
    <span class="n"><img [src]="r.icon.src" [alt]="r.icon.label" [title]="r.icon.label" /><span class="name">{{ r.name }}</span></span>
    <span class="c">
      <span class="main" title="Coût main">{{ r.main }}</span>
      <span class="res" title="Coût réserve">{{ r.res }}</span>
    </span>
    <span class="p val">{{ r.f }}</span>
    <span class="p val">{{ r.m }}</span>
    <span class="p val">{{ r.o }}</span>
  </div>
}
