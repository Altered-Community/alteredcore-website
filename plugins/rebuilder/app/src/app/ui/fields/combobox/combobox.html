@for (v of values(); track v.id) {
  <div class="picked">
    <span>@if (v.glyph) {<span class="glyph" aria-hidden="true">{{ v.glyph }}</span>}{{ v.text }}</span>
    <button type="button" [attr.aria-label]="'Retirer ' + v.text" (click)="remove(v)"><ar-icon name="x" [size]="14" [strokeWidth]="2.4" /></button>
  </div>
  <span class="or" aria-hidden="true">ou</span>
}
<div class="field">
  <button
    #toggle
    type="button"
    class="toggle"
    role="combobox"
    aria-haspopup="listbox"
    [attr.aria-label]="placeholder()"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="listId"
    (click)="toggleOpen()"
    (keydown)="onToggleKey($event)"
  >
    <span class="label">{{ label() }}</span>
    <span class="chev" [class.up]="open()"><ar-icon name="chevron-down" [size]="16" /></span>
  </button>
</div>
@if (open()) {
  <div class="panel" (mousedown)="keepFocus($event)">
    <div class="search">
      <span class="search-icon"><ar-icon name="search" [size]="16" /></span>
      <input
        #search
        type="search"
        enterkeyhint="search"
        autocomplete="off"
        [attr.aria-label]="searchPlaceholder()"
        [attr.aria-controls]="listId"
        [placeholder]="searchPlaceholder()"
        [value]="query()"
        (input)="setQuery(search.value)"
        (keydown.arrowDown)="move(1, $event)"
        (keydown.arrowUp)="move(-1, $event)"
        (keydown.enter)="pickActive($event)"
        (keydown.escape)="close($event)"
      />
    </div>
    @if (filtered().length) {
      <div role="listbox" class="list" [id]="listId" [attr.aria-label]="placeholder()">
        @for (o of filtered(); track o.id) {
          <button
            type="button"
            role="option"
            [attr.aria-selected]="$index === active()"
            [class.active]="$index === active()"
            (click)="pick(o)"
          >@if (o.glyph) {<span class="glyph" aria-hidden="true">{{ o.glyph }}</span>}{{ o.text }}</button>
        }
      </div>
    } @else {
      <div class="empty" [id]="listId">{{ query() ? 'Aucun résultat' : 'Aucune valeur disponible' }}</div>
    }
  </div>
}
