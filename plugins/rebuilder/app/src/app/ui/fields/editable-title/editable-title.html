<label [for]="id" class="pen" title="Renommer le deck" i18n-title="@@ui.editableTitle.rename"><ac-icon name="pencil" [size]="16" /></label>
<input
  #field
  [id]="id"
  [attr.aria-label]="ariaLabel()"
  [value]="value()"
  [style.width.ch]="width()"
  (input)="value.set(field.value)"
  (change)="commit.emit(field.value)"
  (keydown.enter)="field.blur()"
/>
