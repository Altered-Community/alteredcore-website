@if (label()) {
  <label [for]="id" class="ac-field__label">{{ label() }}@if (required()) {<span class="ac-field__required"> *</span>}</label>
}
<div class="wrap" [class.ac-input-icon]="!!icon()">
  @if (icon(); as i) {
    <ac-icon [name]="i" [size]="18" />
  }
  <input
    #field
    class="ac-input"
    [class.ac-input--subtle]="appearance() === 'subtle'"
    [id]="id"
    [type]="type()"
    [attr.inputmode]="inputmode()"
    [attr.enterkeyhint]="enterkeyhint()"
    [attr.aria-label]="label() ? null : ariaLabel() || placeholder()"
    [attr.aria-invalid]="invalid() || null"
    [placeholder]="placeholder()"
    [value]="value()"
    autocomplete="off"
    (input)="emit(field.value)"
    (keydown.enter)="enter.emit(field.value)"
    (blur)="onTouched()"
  />
  @if (clearable() && value()) {
    <button type="button" class="clear" aria-label="Effacer" (click)="emit(''); field.focus()">
      <ac-icon name="x" [size]="16" />
    </button>
  }
</div>
