@if (label()) {
  <label [for]="id" class="label">{{ label() }}@if (required()) {<span class="req"> *</span>}</label>
}
<div class="wrap">
  @if (icon(); as i) {
    <span class="icon"><ar-icon [name]="i" [size]="18" /></span>
  }
  <input
    #field
    [id]="id"
    [type]="type()"
    [attr.inputmode]="inputmode()"
    [attr.enterkeyhint]="enterkeyhint()"
    [attr.aria-label]="label() ? null : ariaLabel() || placeholder()"
    [attr.aria-invalid]="invalid() || null"
    [placeholder]="placeholder()"
    [value]="value()"
    [readOnly]="readonly()"
    [class.with-icon]="!!icon()"
    [class.subtle]="appearance() === 'subtle'"
    autocomplete="off"
    (input)="emit(field.value)"
    (keydown.enter)="enter.emit(field.value)"
    (blur)="onTouched()"
    (focus)="readonly() && field.select()"
  />
  @if (clearable() && value()) {
    <button type="button" class="clear" aria-label="Effacer" i18n-aria-label="@@ui.input.clear" (click)="emit(''); field.focus()">
      <ar-icon name="x" [size]="16" />
    </button>
  }
</div>
