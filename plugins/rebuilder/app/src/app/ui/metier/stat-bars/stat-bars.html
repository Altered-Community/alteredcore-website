@if (title()) {
  <h3>{{ title() }}</h3>
}
<ul [attr.aria-label]="title() || null">
  @for (r of rows(); track r.key) {
    <li [style.--bar]="r.color || null">
      <span class="label">
        @if (r.icon) {
          <img [src]="r.icon" [alt]="r.label" [title]="r.label" />
        } @else {
          {{ r.label }}
        }
      </span>
      <span class="track" aria-hidden="true"><span class="fill" [style.width.%]="width(r.value)"></span></span>
      <span class="value">{{ figure(r.value) }}</span>
    </li>
  }
</ul>
