<span class="label">{{ label() }}</span>
<ul [attr.aria-label]="label()">
  @for (r of rows(); track r.key) {
    <li [class]="'tone-' + (r.tone ?? 'primary')">
      @if (r.iconSrc) {
        <img class="name" [src]="r.iconSrc" [alt]="r.label" [title]="r.label" />
      } @else {
        <span class="name">{{ r.label }}</span>
      }
      <span class="track" aria-hidden="true"><span class="fill" [style.width.%]="width(r.value)"></span></span>
      <strong>{{ r.value }}</strong>
    </li>
  }
</ul>
