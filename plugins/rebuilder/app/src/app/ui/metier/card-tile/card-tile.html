<div class="visual">
  @if (unique()) {
    <ac-unique-card [card]="card()" [eager]="eager()" />
  } @else {
    <ac-card-art [reference]="card().reference" [eager]="eager()" [neutral]="true" />
  }
</div>
@if (plain()) {
  <!-- Card browser: no quantity control. -->
} @else if (readonly()) {
  <span class="qty" [attr.aria-label]="quantityLabel()">×{{ quantity() }}</span>
} @else if (quantity() === 0) {
  <ac-card-add class="action" [label]="addLabel()" [disabled]="max() === 0" (add)="quantityChange.emit(1)" />
} @else {
  <ac-stepper
    class="action"
    appearance="overlay"
    [label]="copiesLabel()"
    [value]="quantity()"
    [max]="max()"
    (valueChange)="quantityChange.emit($event)"
  />
}
