<ng-template #face>
  @if (unique()) {
    <ar-unique-card [card]="card()" [eager]="eager()" />
  } @else {
    <ar-card-art [reference]="card().reference" [eager]="eager()" [neutral]="true" />
  }
</ng-template>
@if (zoomable()) {
  <button type="button" class="visual zoom" aria-haspopup="dialog" [attr.aria-label]="zoomLabel()" (click)="zoom.emit()">
    <ng-container [ngTemplateOutlet]="face" />
  </button>
} @else {
  <div class="visual">
    <ng-container [ngTemplateOutlet]="face" />
  </div>
}
@if (plain()) {
  <!-- Card browser: no quantity control. -->
} @else if (readonly()) {
  <span class="qty" [attr.aria-label]="quantityLabel()">×{{ quantity() }}</span>
} @else if (quantity() === 0 && max() === 0 && blockedReason()) {
  <span class="action blocked" [title]="blockedReason()">
    <ar-badge tone="neutral" icon="lock" aria-hidden="true">{{ blockedShort }}</ar-badge>
    <span class="ar-sr-only">{{ blockedReason() }}</span>
  </span>
} @else if (quantity() === 0) {
  <ar-card-add class="action" [label]="addLabel()" [disabled]="max() === 0" (add)="quantityChange.emit(1)" />
} @else {
  <ar-stepper
    class="action"
    appearance="overlay"
    [label]="copiesLabel()"
    [value]="quantity()"
    [max]="max()"
    (valueChange)="quantityChange.emit($event)"
  />
}
