@if (readonly() && !plain()) {
  <span class="qty">×{{ quantity() }}</span>
}
<img class="rarity" [src]="rarity().src" [alt]="rarity().label" [title]="rarity().label" />
<span class="name">{{ name() }}</span>
@if (readonly() || plain()) {
  <span class="costs">
    <span class="c main" title="Coût main">{{ card().mainCost ?? '–' }}</span>
    <span class="c res" title="Coût réserve">{{ card().recallCost ?? '–' }}</span>
  </span>
} @else {
  <ac-stepper
    [appearance]="appearance() === 'panel' ? 'box' : 'inline'"
    [itemName]="name()"
    [value]="quantity()"
    [max]="max()"
    (valueChange)="quantityChange.emit($event)"
  />
}
