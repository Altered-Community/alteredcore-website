@let s = state();
@if (s !== 'idle') {
  @switch (s) {
    @case ('saved') {
      <ar-icon name="check" [size]="14" [strokeWidth]="2.4" />
    }
    @case ('error') {
      <ar-icon name="alert" [size]="14" [strokeWidth]="2.4" />
    }
    @default {
      <span class="dot" aria-hidden="true"></span>
    }
  }
  <span [class.ar-sr-only]="iconOnly()">{{ label() }}</span>
}
