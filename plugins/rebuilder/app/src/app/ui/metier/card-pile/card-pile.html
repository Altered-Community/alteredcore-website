<ng-template #face let-reference>
  @if (unique()) {
    <ac-unique-card [card]="card()" />
  } @else {
    <ac-card-art [reference]="reference" [neutral]="true" />
  }
</ng-template>
<button type="button" class="stack" aria-haspopup="dialog" [attr.aria-label]="zoomLabel()" [style.--copies]="behind().length" (click)="zoom.emit()">
  @for (l of layers(); track l.i) {
    <span class="face layer" [style.--i]="l.i" aria-hidden="true"><ng-container [ngTemplateOutlet]="face" [ngTemplateOutletContext]="{ $implicit: l.reference }" /></span>
  }
  <span class="face front"><ng-container [ngTemplateOutlet]="face" [ngTemplateOutletContext]="{ $implicit: card().reference }" /></span>
</button>
@if (issues().length && quantity() > 0) {
  <span class="marker" role="img" [attr.aria-label]="issueLabel()" [title]="issueLabel()"><ac-icon name="circle-alert" [size]="16" [strokeWidth]="2.4" /></span>
}
@if (illustrations()) {
  <button type="button" class="illustrate" aria-haspopup="dialog" [attr.aria-label]="illustrateLabel()" [title]="illustrateLabel()" (click)="illustrate.emit()">
    <ac-icon name="brush" [size]="18" />
  </button>
}
@if (quantity() > 1) {
  <span class="qty" aria-hidden="true">×{{ quantity() }}</span>
}
@if (!readonly()) {
  <ac-stepper
    class="stepper"
    appearance="overlay"
    [label]="copiesLabel()"
    [itemName]="name()"
    [value]="quantity()"
    [max]="max()"
    (valueChange)="quantityChange.emit($event)"
  />
}
