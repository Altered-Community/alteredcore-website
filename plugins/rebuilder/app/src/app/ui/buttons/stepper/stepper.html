<div role="group" [class]="'group ac-stepper--' + appearance()" [attr.aria-label]="label() || 'Exemplaires'">
  <button type="button" class="dec" [attr.aria-label]="'Retirer un exemplaire' + suffix()" [disabled]="value() <= min()" (click)="step(-1)">
    <span class="ring"><ac-icon name="minus" [size]="iconSize()" [strokeWidth]="2.6" /></span>
  </button>
  <span class="value" aria-live="polite">{{ value() }}</span>
  <button type="button" class="inc" [attr.aria-label]="'Ajouter un exemplaire' + suffix()" [disabled]="value() >= max()" (click)="step(1)">
    <span class="ring"><ac-icon name="plus" [size]="iconSize()" [strokeWidth]="2.6" /></span>
  </button>
</div>
