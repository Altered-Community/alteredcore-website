<div class="split" #split>
  <button type="button" class="main" [disabled]="busy()" [attr.aria-busy]="busy()" (click)="press.emit()">
    @if (busy()) {
      <ac-icon class="spin" name="loader-circle" [size]="size() === 'sm' ? 16 : 18" />
    } @else if (icon(); as name) {
      <ac-icon [name]="name" [size]="size() === 'sm' ? 16 : 18" />
    }
    <span class="main-label"><ng-content /></span>
  </button>
  <span class="sep" aria-hidden="true"></span>
  <button
    type="button"
    class="more"
    [cdkMenuTriggerFor]="menu"
    [cdkMenuPosition]="positions"
    [disabled]="busy()"
    [attr.aria-label]="moreLabel()"
    (cdkMenuOpened)="opened(split)"
  >
    <ac-icon name="chevron-down" [size]="size() === 'sm' ? 16 : 18" />
  </button>
</div>

<ng-template #menu>
  <div class="menu" cdkMenu [style.min-width.px]="width()" [attr.aria-label]="menuLabel()">
    @for (item of items(); track item.id) {
      <button type="button" class="item" cdkMenuItem (cdkMenuItemTriggered)="pick.emit(item.id)">
        <ac-icon [name]="item.icon" [size]="18" />
        <span class="text">
          <span class="label">{{ item.label }}</span>
          @if (item.hint) {
            <span class="hint">{{ item.hint }}</span>
          }
        </span>
        @if (item.badge) {
          <span class="badge">{{ item.badge }}</span>
        }
      </button>
    }
  </div>
</ng-template>
