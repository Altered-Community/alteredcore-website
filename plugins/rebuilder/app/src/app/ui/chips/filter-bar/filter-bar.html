<div class="scroller" role="list" aria-label="Filtres actifs">
  @for (c of chips(); track c.id) {
    <ac-chip role="listitem" [label]="c.label" [removable]="true" (remove)="remove.emit(c.id)" />
  }
</div>
@if (chips().length) {
  <div class="clear">
    <button type="button" (click)="clearAll.emit()">Tout effacer</button>
  </div>
}
