<button
  type="button"
  class="ac-chip"
  [class.ac-chip--square]="shape() === 'square'"
  [class.ac-chip--icon]="iconOnly() && !!image()"
  [class.is-on]="selected() || removable()"
  [attr.aria-pressed]="removable() ? null : selected()"
  [attr.aria-label]="removable() ? removeLabel() : iconOnly() && image() ? label() : null"
  [attr.title]="iconOnly() && image() ? label() : null"
  (click)="removable() ? remove.emit() : selected.set(!selected())"
>
  @if (image(); as src) {
    <img class="ac-chip__img" [src]="src" alt="" width="18" height="18" />
  } @else if (dot()) {
    <span class="ac-chip__dot" [style.--ac-chip-dot]="dot()"></span>
  }
  @if (!iconOnly() || !image()) {
    {{ label() }}
  }
  @if (removable()) {
    <span class="ac-chip__remove"><ac-icon name="x" [size]="14" [strokeWidth]="2.4" /></span>
  }
</button>
