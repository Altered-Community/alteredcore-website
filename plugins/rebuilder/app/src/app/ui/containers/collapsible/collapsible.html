<button type="button" class="head" [attr.aria-expanded]="open()" [attr.aria-controls]="id" (click)="open.set(!open())">
  <span class="chev"><ar-icon name="chevron-down" [size]="16" [strokeWidth]="2.4" /></span>
  <span class="title">{{ title() }}</span>
  <ng-content select="[summary]" />
</button>
@if (open()) {
  <div class="body" [id]="id"><ng-content /></div>
}
