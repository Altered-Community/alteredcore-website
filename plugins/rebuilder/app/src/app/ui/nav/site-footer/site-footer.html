<footer>
  <img class="logo" [src]="logoSrc()" [alt]="logoAlt()" width="1127" height="371" />
  <p class="disclaimer">{{ disclaimer() }}</p>
  <nav aria-label="Liens du pied de page">
    @for (link of links(); track link.route) {
      <a [routerLink]="link.route">{{ link.label }}</a>
    }
    @for (link of externalLinks(); track link.href) {
      <a class="external" [href]="link.href" target="_blank" rel="noopener">
        {{ link.label }}
        <ar-icon name="external-link" [size]="13" />
        <span class="ar-sr-only">(nouvel onglet)</span>
      </a>
    }
  </nav>
</footer>
