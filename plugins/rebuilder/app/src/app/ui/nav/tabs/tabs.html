@for (t of tabs(); track t.id) {
  <button
    type="button"
    role="tab"
    [id]="'tab-' + t.id"
    [attr.aria-selected]="t.id === active()"
    [attr.tabindex]="t.id === active() ? 0 : -1"
    (click)="active.set(t.id)"
    (keydown.arrowRight)="step(1)"
    (keydown.arrowLeft)="step(-1)"
  >{{ t.label }}@if (t.count !== undefined) {<span class="ac-tabs__count"> · {{ t.count }}</span>}</button>
}
