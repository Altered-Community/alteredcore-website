name: Deploy

# Synchronise les fichiers suivis par git vers le serveur via FTP / FTPS / SFTP.
# Déclenché à chaque push (ou merge) sur la branche dev.
on:
  push:
    branches: [preprod]
  workflow_dispatch: {} # permet aussi un déclenchement manuel depuis l'onglet Actions

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true # un nouveau push annule un déploiement en cours

jobs:
  deploy:
    name: Sync to server
    runs-on: ubuntu-latest
    environment: preprod # secrets/variables sont définis dans cet environnement GitHub
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          # ─── Connexion (Settings → Secrets and variables → Actions) ──────────
          # protocol / host / user peuvent être des Variables (non-secret) OU des
          # Secrets : le workflow prend la Variable si elle existe, sinon le Secret.
          # Le mot de passe DOIT être un Secret (les Variables sont visibles en clair).
          protocol: ${{ vars.DEPLOY_PROTOCOL || secrets.DEPLOY_PROTOCOL }} # "ftp", "ftps" ou "sftp"
          server: ${{ vars.DEPLOY_HOST || secrets.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER || secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ vars.DEPLOY_PORT || ((vars.DEPLOY_PROTOCOL || secrets.DEPLOY_PROTOCOL) == 'sftp' && '22' || '21') }}

          # Répertoire cible sur le serveur (laisser ./ si la racine du compte FTP
          # pointe déjà sur le site ; sinon ex: "public_html/").
          server-dir: ${{ vars.DEPLOY_SERVER_DIR || './' }}

          # ─── Suppressions sûres ──────────────────────────────────────────────
          # L'action conserve un fichier d'état (.ftp-deploy-sync-state.json) sur le
          # serveur et ne supprime QUE les fichiers qu'elle a elle-même déployés.
          # Les plugins externes (présents uniquement sur le serveur, jamais poussés
          # par cette action) ne sont donc jamais supprimés.

          # ─── Fichiers à NE PAS envoyer / supprimer ──────────────────────────
          # Note : fournir "exclude" remplace la liste par défaut, donc on
          # ré-inclut les motifs git habituels.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            .claude/**
            memory/**
            docs/**
            logs/**
            config.local.php
            docker/**
            docker-compose.yml
            Dockerfile
            README.md
            LICENSE.md
            CONTRIBUTING.md
            git-manager.py
