name: Deploy

# Déploie les fichiers suivis par git vers le serveur, puis joue les migrations DB.
#  • Transfert : lftp (même logique liste blanche pour ftp, ftps ET sftp).
#  • Migrations : php sql/bootstrap.php exécuté en SSH (preprod et prod ont SSH).
# Déclenché à chaque push (ou merge) sur preprod → environnement preprod
#                                          sur main  → environnement prod
on:
  push:
    branches: [preprod, main]
  workflow_dispatch: {} # permet aussi un déclenchement manuel depuis l'onglet Actions

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true # un nouveau push annule un déploiement en cours

jobs:
  deploy:
    name: Sync to server
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'preprod' }}
    steps:
      - name: Vérification de la branche
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" && "$GITHUB_REF" != "refs/heads/preprod" ]]; then
            echo "::error::Ce workflow ne peut être déclenché que depuis 'main' (prod) ou 'preprod'. Branche courante : $GITHUB_REF"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      # ─── Transfert (lftp : ftp / ftps / sftp) ───────────────────────────────
      # APPROCHE LISTE BLANCHE : on ne synchronise QUE les dossiers/fichiers
      # explicitement listés. Tout le reste du serveur (staticpages, files,
      # dossiers créés par les plugins, plugins externes, config.local.php…) n'est
      # jamais référencé → jamais touché ni supprimé.
      #   • MIRROR_DIRS : dossiers 100 % gérés par git → miroir avec --delete
      #                   (les fichiers retirés de git sont nettoyés côté serveur).
      #   • PUSH_DIRS   : dossiers à contenu serveur → envoi SANS --delete.
      #   • ROOT_FILES  : fichiers racine déployés explicitement.
      #   • plugins/    : chaque plugin SUIVI par git en miroir (--delete) + les
      #                   fichiers de niveau racine ; plugins externes non touchés.
      # lftp parle ftp, ftps ET sftp → exactement la même logique pour preprod et prod.
      - name: Deploy via lftp
        env:
          PROTO: ${{ vars.DEPLOY_PROTOCOL || secrets.DEPLOY_PROTOCOL }} # ftp | ftps | sftp
          REMOTE_HOST: ${{ vars.DEPLOY_HOST || secrets.DEPLOY_HOST }}
          REMOTE_USER: ${{ vars.DEPLOY_USER || secrets.DEPLOY_USER }}
          REMOTE_PASS: ${{ secrets.DEPLOY_PASSWORD }}
          REMOTE_PORT: ${{ vars.DEPLOY_PORT || '' }} # vide → 22 (sftp) ou 21 (ftp/ftps)
          REMOTE_PATH: ${{ vars.DEPLOY_SERVER_DIR || '.' }}
          VERIFY_CERT: ${{ vars.DEPLOY_VERIFY_CERT || 'yes' }} # ftps : 'no' si certif auto-signé
          DEPLOY_PARALLEL: ${{ vars.DEPLOY_PARALLEL || '8' }} # transferts SFTP simultanés
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp

          PORT="$REMOTE_PORT"
          case "$PROTO" in
            sftp)      PORT="${PORT:-22}" ;;
            ftp|ftps)  PORT="${PORT:-21}" ;;
            *) echo "DEPLOY_PROTOCOL invalide: '$PROTO' (attendu: ftp, ftps ou sftp)"; exit 1 ;;
          esac
          RP="${REMOTE_PATH%/}"; [ -n "$RP" ] || RP="."
          PARALLEL="${DEPLOY_PARALLEL:-8}"
          HASHDIR=".deploy-hashes"
          echo "lftp → protocol=$PROTO port=$PORT path=$RP parallel=$PARALLEL"

          # ── Liste blanche ────────────────────────────────────────────────────
          MIRROR_DIRS=(admin assets auth css includes js pages sql themes)
          ROOT_FILES=(index.php .htaccess config.php config.php.example config.local.php.example)
          PLUGIN_TOP_FILES=(plugins/.htaccess plugins/plugin.schema.json plugins/README.html)
          cp data/tinymce_shortcodes.json data/tinymce_shortcodes.json.dist

          # Unités hash-gatées "nom|chemin_local|chemin_distant" : on compare un hash
          # du CONTENU du dossier à celui stocké côté serveur ($RP/.deploy-hashes/<nom>)
          # et on SAUTE le dossier si identique. Sans ça, actions/checkout réécrit les
          # mtime → lftp re-transfère tout à chaque run (lent + "supprime/recrée tout").
          UNITS=()
          for d in "${MIRROR_DIRS[@]}"; do UNITS+=("$d|$d|$RP/$d"); done
          for d in plugins/*/; do n="$(basename "$d")"; UNITS+=("plugin_$n|${d%/}|$RP/plugins/$n"); done

          # Préambule de connexion (identifiants par stdin, jamais loggés).
          conn() {
            echo "set net:timeout 20"
            echo "set net:max-retries 3"
            case "$PROTO" in
              sftp) echo "set sftp:auto-confirm yes" ;;
              ftps) echo "set ftp:ssl-force true; set ftp:ssl-protect-data true; set ftp:passive-mode true; set ssl:verify-certificate $VERIFY_CERT" ;;
              ftp)  echo "set ftp:ssl-allow no; set ftp:passive-mode true" ;;
            esac
            echo "open $PROTO://$REMOTE_HOST:$PORT"
            echo "user \"$REMOTE_USER\" \"$REMOTE_PASS\""
          }

          # 1) Hash local de chaque unité (contenu + chemins triés → couvre ajout/suppr/renommage).
          mkdir -p /tmp/lh /tmp/rh
          for u in "${UNITS[@]}"; do
            name="${u%%|*}"; rest="${u#*|}"; lpath="${rest%%|*}"
            ( cd "$lpath" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum ) \
              | sha256sum | awk '{print $1}' > "/tmp/lh/$name"
            : > "/tmp/rh/$name"
          done

          # 2) Récupère les hash distants (best-effort : absents au 1er run → vides).
          {
            conn
            echo "set cmd:fail-exit no"
            echo "lcd /tmp/rh"
            for u in "${UNITS[@]}"; do echo "get \"$RP/$HASHDIR/${u%%|*}\""; done
            echo "bye"
          } | lftp || true

          # 3) Décide quoi synchroniser (boucle SANS pipe → variables conservées).
          MIRROR_LINES=(); CHANGED=()
          for u in "${UNITS[@]}"; do
            name="${u%%|*}"; rest="${u#*|}"; lpath="${rest%%|*}"; rpath="${rest#*|}"
            lh="$(tr -d '[:space:]' < "/tmp/lh/$name")"
            rh="$(tr -d '[:space:]' < "/tmp/rh/$name" 2>/dev/null || true)"
            if [ -n "$lh" ] && [ "$lh" = "$rh" ]; then
              echo "[skip] $lpath (inchangé)"
            else
              echo "[sync] $lpath"
              MIRROR_LINES+=("mirror -R --delete --parallel=$PARALLEL -- ./$lpath/ $rpath/")
              CHANGED+=("$name")
            fi
          done

          # 4) Miroir des unités modifiées + uploads (sans --delete) + fichiers racine/plugins.
          {
            conn
            echo "set cmd:fail-exit yes"
            for line in "${MIRROR_LINES[@]}"; do echo "$line"; done
            # uploads/ : on pousse seulement le(s) fichier(s) suivi(s) (pas de --delete,
            # pas de scan distant) → les images uploadées par les users sont préservées.
            echo "mkdir -p $RP/uploads || echo exists"
            echo "mput -O $RP/uploads uploads/.htaccess"
            echo "mput -O $RP ${ROOT_FILES[*]}"
            echo "mkdir -p $RP/data || echo exists"
            echo "mput -O $RP/data data/tinymce_shortcodes.json.dist"
            echo "mkdir -p $RP/plugins || echo exists"
            echo "mput -O $RP/plugins ${PLUGIN_TOP_FILES[*]}"
            echo "bye"
          } | lftp

          # 5) Met à jour les hash distants des unités synchronisées (session séparée :
          #    un miroir échoué laisse le hash périmé → retry idempotent au run suivant).
          if [ "${#CHANGED[@]}" -gt 0 ]; then
            {
              conn
              echo "set cmd:fail-exit no"
              echo "mkdir -p $RP/$HASHDIR"
              echo "set cmd:fail-exit yes"
              for name in "${CHANGED[@]}"; do echo "put -O $RP/$HASHDIR /tmp/lh/$name"; done
              echo "bye"
            } | lftp
          fi

      # ─── Bootstrap + migrations DB (après l'upload, via SSH) ─────────────────
      # Exécute sql/bootstrap.php sur le serveur. Idempotent et zéro-touch :
      #   • crée uploads/ et sème data/tinymce_shortcodes.json si absents ;
      #   • CREATE DATABASE IF NOT EXISTS (DB_USER doit avoir le droit) ;
      #   • DB neuve  → import schema.sql + baseline des migrations ;
      #   • DB existante → applique les migrations en attente.
      # Réutilise host/user/password ; ajoute si besoin les variables :
      #   DEPLOY_SSH_PORT   port SSH (défaut: 22)
      #   DEPLOY_SERVER_DIR chemin du site (où se trouve sql/ ; défaut: ~/)
      #   PHP_BIN           binaire PHP, ex: php8.2 (défaut: php)
      - name: Bootstrap & migrate DB (SSH)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.DEPLOY_HOST || secrets.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER || secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ vars.DEPLOY_SSH_PORT || '22' }}
          script_stop: true # échoue le job si une commande échoue
          script: |
            cd "${{ vars.DEPLOY_SERVER_DIR || '~/' }}"
            ${{ vars.PHP_BIN || 'php' }} sql/bootstrap.php
