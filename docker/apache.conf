<VirtualHost *:80>
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>
    # Container stdout/stderr rather than a file, so `docker compose logs` shows
    # Apache's own access/error lines alongside the app's (see ERROR_LOG_TARGET).
    ErrorLog "/proc/self/fd/2"
    CustomLog "/proc/self/fd/1" combined
</VirtualHost>
